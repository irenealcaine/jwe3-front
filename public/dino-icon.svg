<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dinoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#dinoGradient)" stroke="#047857" stroke-width="8"/>
  
  <!-- Dinosaur body -->
  <ellipse cx="280" cy="320" rx="80" ry="60" fill="#065f46" opacity="0.9"/>
  
  <!-- Dinosaur head -->
  <ellipse cx="220" cy="220" rx="60" ry="50" fill="#065f46" opacity="0.9"/>
  
  <!-- Dinosaur neck -->
  <path d="M 240 260 Q 250 280 270 300" stroke="#065f46" stroke-width="35" fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Dinosaur tail -->
  <path d="M 350 320 Q 400 300 420 280 Q 430 270 425 260" stroke="#065f46" stroke-width="25" fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Legs -->
  <ellipse cx="260" cy="370" rx="15" ry="25" fill="#065f46" opacity="0.9"/>
  <ellipse cx="300" cy="375" rx="15" ry="25" fill="#065f46" opacity="0.9"/>
  
  <!-- Eye -->
  <circle cx="200" cy="210" r="8" fill="#ffffff"/>
  <circle cx="202" cy="208" r="4" fill="#000000"/>
  
  <!-- Spikes on back -->
  <polygon points="250,280 260,250 270,280" fill="#047857"/>
  <polygon points="270,285 280,255 290,285" fill="#047857"/>
  <polygon points="290,290 300,260 310,290" fill="#047857"/>
  
  <!-- Nostril -->
  <ellipse cx="185" cy="215" rx="2" ry="3" fill="#047857"/>
</svg>